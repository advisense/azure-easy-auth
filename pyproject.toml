[project]
name = "azure-easy-auth"
version = "0.2.0"
description = "Simple library to enable the 'Easy' in Azure Easy Authentication"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project.optional-dependencies]
fastapi = ["fastapi>=0.95.0"]
graph = ["httpx>=0.24.0"]
dev = ["pytest", "fastapi>=0.95.0", "httpx>=0.24.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
