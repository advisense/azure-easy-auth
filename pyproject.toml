[project]
name = "azure-easy-auth"
version = "0.1.0"
description = "Simple library to enable the 'Easy' in Azure Easy Authentication"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
